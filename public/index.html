<script>
/* ------------------------------------------------------------------ *
 * Time parsing / formatting
 * ------------------------------------------------------------------ */
function parseDuration(raw) {
  const s = String(raw).trim();
  if (!s) return null;
  // "90" -> 90s, "5:00" -> 5m, "1:02:03" -> 1h2m3s, "5m", "1h30m"
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (/^[\d:]+$/.test(s)) {
    const parts = s.split(':').map(p => parseInt(p || '0', 10));
    if (parts.some(isNaN) || parts.length > 3) return null;
    return parts.reduce((acc, p) => acc * 60 + p, 0);
  }
  const m = s.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?\s*(?:(\d+)\s*s)?$/i);
  if (m && (m[1] || m[2] || m[3])) {
    return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  }
  return null;
}

function format(totalSeconds) {
  const t = Math.max(0, Math.ceil(totalSeconds));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  const pad = n => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

/* ------------------------------------------------------------------ *
 * The riff — an approximation of the Europe hook, easy to tweak.
 * Beats are relative to the top of a 16-beat (4-bar) loop.
 * ------------------------------------------------------------------ */
const BPM = 118;
const BEAT = 60 / BPM;
const LOOP_BEATS = 16;

const MELODY = [ // [note, startBeat, durationBeats]
  ['D5',  0,   0.5], ['C#5', 0.5, 0.5], ['D5',  1,   0.5], ['A4',  1.5, 1.5],
  ['G4',  4,   0.5], ['F#4', 4.5, 0.5], ['G4',  5,   0.5], ['D5',  5.5, 1.5],
  ['C#5', 8,   0.5], ['B4',  8.5, 0.5], ['C#5', 9,   0.5], ['F#4', 9.5, 1.5],
  ['G4', 12,   0.5], ['A4', 12.5, 0.5], ['B4', 13,   0.5], ['C#5',13.5, 0.5],
  ['D5', 14,   2.0],
];
const BASS_ROOTS = ['D2', 'G2', 'F#2', 'B2']; // one per bar

const SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(name) {
  const m = /^([A-G])(#|b)?(-?\d+)$/.exec(name);
  const semi = SEMITONES[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const midi = (parseInt(m[3], 10) + 1) * 12 + semi;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* Build one loop's worth of scheduled events, sorted by beat. */
function buildEvents() {
  const ev = [];
  for (const [note, beat, dur] of MELODY) {
    ev.push({ beat, kind: 'lead', freq: noteFreq(note), dur: dur * BEAT });
  }
  for (let bar = 0; bar < 4; bar++) {
    const root = noteFreq(BASS_ROOTS[bar]);
    for (let i = 0; i < 8; i++) {           // eighth-note pulse
      const beat = bar * 4 + i * 0.5;
      ev.push({ beat, kind: 'bass', freq: i % 4 === 3 ? root * 2 : root, dur: 0.4 * BEAT });
      ev.push({ beat, kind: 'hat' });
      if (i % 4 === 0) ev.push({ beat, kind: 'kick' });
      if (i % 4 === 2) ev.push({ beat, kind: 'snare' });
    }
  }
  return ev.sort((a, b) => a.beat - b.beat);
}
const EVENTS = buildEvents();

/* ------------------------------------------------------------------ *
 * Synth engine
 * ------------------------------------------------------------------ */
let ctx = null, master = null, delaySend = null, noiseBuf = null;
let schedTimer = null, eventIndex = 0, loopOrigin = 0;
const LOOKAHEAD = 0.12; // seconds of audio scheduled in advance

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  master = ctx.createGain();
  master.gain.value = volumeSlider.value / 100 * 0.8;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.ratio.value = 5;
  master.connect(comp).connect(ctx.destination);

  // 80s slapback echo
  const delay = ctx.createDelay(1);
  delay.delayTime.value = BEAT * 0.75;
  const fb = ctx.createGain(); fb.gain.value = 0.32;
  delaySend = ctx.createGain(); delaySend.gain.value = 0.3;
  delaySend.connect(delay);
  delay.connect(fb).connect(delay);
  delay.connect(master);

  const frames = Math.floor(ctx.sampleRate * 0.5);
  noiseBuf = ctx.createBuffer(1, frames, ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
}

function lead(t, freq, dur) {
  const amp = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.value = 7;
  filter.frequency.setValueAtTime(5200, t);
  filter.frequency.exponentialRampToValueAtTime(1400, t + dur);

  const oscs = [
    Object.assign(ctx.createOscillator(), { type: 'sawtooth' }),
    Object.assign(ctx.createOscillator(), { type: 'square' }),
    Object.assign(ctx.createOscillator(), { type: 'sawtooth' }),
  ];
  oscs[0].frequency.value = freq;
  oscs[1].frequency.value = freq; oscs[1].detune.value = 8;
  oscs[2].frequency.value = freq * 2; oscs[2].detune.value = -6;

  const mix = ctx.createGain(); mix.gain.value = 0.33;
  oscs.forEach(o => { o.connect(mix); o.start(t); o.stop(t + dur + 0.2); });
  mix.connect(filter).connect(amp);
  amp.connect(master);
  amp.connect(delaySend);

  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.42, t + 0.012);
  amp.gain.linearRampToValueAtTime(0.30, t + Math.min(0.12, dur));
  amp.gain.setTargetAtTime(0.0001, t + dur * 0.85, 0.05);
}

function bass(t, freq, dur) {
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 420;
  filter.Q.value = 3;
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.45, t + 0.01);
  amp.gain.setTargetAtTime(0.0001, t + dur * 0.6, 0.04);
  osc.connect(filter).connect(amp).connect(master);
  osc.start(t); osc.stop(t + dur + 0.15);
}

function noise(t, { dur, hp, gain }) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = hp;
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(gain, t);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(amp).connect(master);
  src.start(t); src.stop(t + dur + 0.05);
}

function kick(t) {
  const osc = ctx.createOscillator();
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(45, t + 0.11);
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0.9, t);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  osc.connect(amp).connect(master);
  osc.start(t); osc.stop(t + 0.3);
}

function playEvent(ev, t) {
  switch (ev.kind) {
    case 'lead':  lead(t, ev.freq, ev.dur); break;
    case 'bass':  bass(t, ev.freq, ev.dur); break;
    case 'kick':  kick(t); break;
    case 'snare': noise(t, { dur: 0.17, hp: 1400, gain: 0.32 }); break;
    case 'hat':   noise(t, { dur: 0.035, hp: 7000, gain: 0.09 }); break;
  }
}

/* Lookahead scheduler. While the context is suspended currentTime freezes,
   so this naturally stops queueing new notes. */
function scheduleTick() {
  // Background tabs throttle setInterval; if we've fallen behind, jump the
  // loop forward instead of dumping a pile of overdue notes at once.
  if (loopOrigin + EVENTS[eventIndex].beat * BEAT < ctx.currentTime - 0.4) {
    loopOrigin = ctx.currentTime;
    eventIndex = 0;
  }
  const horizon = ctx.currentTime + LOOKAHEAD;
  while (loopOrigin + EVENTS[eventIndex].beat * BEAT < horizon) {
    const ev = EVENTS[eventIndex];
    playEvent(ev, Math.max(ctx.currentTime, loopOrigin + ev.beat * BEAT));
    eventIndex++;
    if (eventIndex >= EVENTS.length) {
      eventIndex = 0;
      loopOrigin += LOOP_BEATS * BEAT;
    }
  }
}

function synthStart() {
  initAudio();
  ctx.resume();
  if (schedTimer === null) {
    loopOrigin = ctx.currentTime + 0.08;
    eventIndex = 0;
    schedTimer = setInterval(scheduleTick, 25);
    scheduleTick();
  }
}

function synthStop() {
  if (schedTimer !== null) { clearInterval(schedTimer); schedTimer = null; }
  if (ctx) ctx.suspend();
}

/* ------------------------------------------------------------------ *
 * YouTube IFrame Player API
 * The player stays visible on purpose — YouTube's terms don't allow
 * hiding it and using the embed as an audio-only source.
 * ------------------------------------------------------------------ */
let videoId = '9jK-NcRmVcw';   // Default video. Paste any URL to swap.
let videoStart = 117;          // Seconds to start from — honours t= in pasted URLs.
let ytPlayer = null, ytReady = false, ytApiPromise = null, ytPrimed = false;

function parseVideoId(url) {
  const s = String(url).trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}

// YouTube writes timestamps as t=117, t=117s or t=1h57m3s depending on where
// the link was copied from — accept all of them.
function parseStartTime(url) {
  const m = String(url).match(/[?&#](?:t|start)=(\d[\dhms]*)/);
  if (!m) return 0;
  if (/^\d+$/.test(m[1])) return +m[1];
  const p = m[1].match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
  return p ? (+p[1] || 0) * 3600 + (+p[2] || 0) * 60 + (+p[3] || 0) : 0;
}

function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => reject(new Error('blocked'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('timeout')), 12000);
  });
  return ytApiPromise;
}

function ensurePlayer() {
  return loadYouTubeAPI().then(() => {
    if (ytPlayer) return ytPlayer;
    return new Promise(resolve => {
      ytPlayer = new YT.Player('yt-player', {
        videoId,
        host: 'https://www.youtube-nocookie.com',  // no tracking cookies until play
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, start: videoStart },
        events: {
          onReady: e => {
            ytReady = true;
            e.target.setVolume(+volumeSlider.value);
            resolve(ytPlayer);
          },
          onStateChange: e => {
            // Timer outlasting the song? Loop it rather than falling silent.
            if (e.data === YT.PlayerState.ENDED && state === 'running') {
              ytPlayer.seekTo(videoStart, true);
              ytPlayer.playVideo();
            }
          },
          onError: () => ytStatus('That video can’t be embedded. Try another URL.'),
        },
      });
    });
  });
}

function ytStatus(msg) { document.getElementById('yt-status').textContent = msg || ''; }

/* Browsers grant autoplay far more reliably if the player has already been
   started once inside a real click. Do that silently when YouTube is picked. */
function primePlayer() {
  if (ytPrimed || !ytReady || !ytPlayer) return;
  ytPrimed = true;
  try {
    ytPlayer.mute();
    ytPlayer.playVideo();
    setTimeout(() => {
      if (state !== 'running') { ytPlayer.pauseVideo(); ytPlayer.seekTo(videoStart, true); }
      ytPlayer.unMute();
      ytPlayer.setVolume(+volumeSlider.value);
    }, 350);
  } catch (_) { /* player not ready yet; Start will still try */ }
}

function ytPlay() {
  ytStatus('');
  ensurePlayer().then(p => {
    p.unMute();
    p.setVolume(+volumeSlider.value);
    p.playVideo();
    setTimeout(() => {
      if (state === 'running' && ytReady && p.getPlayerState() !== YT.PlayerState.PLAYING) {
        ytStatus('Your browser blocked autoplay — press play on the video once.');
      }
    }, 1200);
  }).catch(() => ytStatus('Couldn’t load the YouTube player (blocked or offline).'));
}

function ytPause()  { if (ytReady && ytPlayer) ytPlayer.pauseVideo(); }
function ytStop()   { if (ytReady && ytPlayer) { ytPlayer.pauseVideo(); ytPlayer.seekTo(videoStart, true); } }

/* ------------------------------------------------------------------ *
 * Source dispatch — exactly one source is ever audible.
 * ------------------------------------------------------------------ */
function musicStart() {
  if (source === 'youtube') return ytPlay();
  if (source === 'file' && userTrack) { userTrack.play().catch(() => {}); return; }
  synthStart();
}

function musicPause() {
  if (source === 'youtube') return ytPause();
  if (source === 'file' && userTrack) { userTrack.pause(); return; }
  synthStop();
}

function musicResume() { musicStart(); }

function musicStop() {
  ytStop();
  if (userTrack) { userTrack.pause(); userTrack.currentTime = 0; }
  synthStop();
}

/* Big final chord when the clock hits zero. */
function fanfare() {
  initAudio();
  ctx.resume().then(() => {
    const t = ctx.currentTime + 0.02;
    ['B2', 'F#3', 'B3', 'D4', 'F#4'].forEach((n, i) => {
      lead(t + i * 0.045, noteFreq(n), 1.9);
    });
    kick(t);
    setTimeout(() => { if (state !== 'running') ctx.suspend(); }, 2600);
  });
}

/* ------------------------------------------------------------------ *
 * Timer
 * ------------------------------------------------------------------ */
/* Captured from the markup so the idle title and the <title> tag can never
   drift apart — render() would otherwise clobber the one search engines index. */
const DEFAULT_TITLE = document.title;

const display = document.getElementById('display');
const input = document.getElementById('input');
const startBtn = document.getElementById('start');
const resetBtn = document.getElementById('reset');
const volumeSlider = document.getElementById('vol');
const fileInput = document.getElementById('file');
const ytWrap = document.getElementById('yt-wrap');
const ytUrl = document.getElementById('yt-url');
const fileWrap = document.getElementById('file-wrap');

let state = 'idle';        // idle | running | paused | done
let source = 'youtube';    // youtube | synth | file
let remaining = 0;         // seconds
let deadline = 0;          // performance.now() ms
let rafId = null;
let userTrack = null;

function render() {
  display.textContent = state === 'done' ? '00:00' : format(remaining);
  display.classList.toggle('long', remaining >= 3600 && state !== 'done');
  display.classList.toggle('warn', state === 'running' && remaining <= 10);
  display.classList.toggle('done', state === 'done');
  document.title = state === 'running'
    ? `${format(remaining)} — Final Countdown Timer`
    : DEFAULT_TITLE;
}

function tick() {
  remaining = (deadline - performance.now()) / 1000;
  if (remaining <= 0) {
    remaining = 0;
    finish();
    return;
  }
  render();
  rafId = requestAnimationFrame(tick);
}

function start() {
  const secs = parseDuration(input.value);
  if (!secs || secs <= 0) {
    input.value = '';
    input.placeholder = 'try 5:00';
    input.focus();
    return;
  }
  remaining = secs;
  deadline = performance.now() + secs * 1000;
  state = 'running';
  musicStart();
  rafId = requestAnimationFrame(tick);
  syncButtons();
  render();
  track('timer_start', { duration_seconds: secs, source });
}

function pause() {
  if (rafId) cancelAnimationFrame(rafId), rafId = null;
  remaining = Math.max(0, (deadline - performance.now()) / 1000);
  state = 'paused';
  musicPause();
  syncButtons();
  render();
  track('timer_pause');
}

function resume() {
  deadline = performance.now() + remaining * 1000;
  state = 'running';
  musicResume();
  rafId = requestAnimationFrame(tick);
  syncButtons();
  render();
}

function finish() {
  if (rafId) cancelAnimationFrame(rafId), rafId = null;
  state = 'done';
  musicStop();
  fanfare();
  syncButtons();
  render();
  track('timer_finish', { duration_seconds: parseDuration(input.value) || 0 });
}

function reset() {
  if (rafId) cancelAnimationFrame(rafId), rafId = null;
  state = 'idle';
  remaining = parseDuration(input.value) || 0;
  musicStop();
  syncButtons();
  render();
  track('timer_reset');
}

function syncButtons() {
  startBtn.textContent = state === 'running' ? 'Pause' : state === 'paused' ? 'Resume' : 'Start';
  resetBtn.disabled = state === 'idle';
  input.disabled = state === 'running' || state === 'paused';
}

startBtn.addEventListener('click', () => {
  if (state === 'running') pause();
  else if (state === 'paused') resume();
  else start();
});
resetBtn.addEventListener('click', reset);

input.addEventListener('input', () => { if (state === 'idle') { remaining = parseDuration(input.value) || 0; render(); } });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && state === 'idle') start(); });

document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state === 'running' || state === 'paused') reset();
    input.value = format(+btn.dataset.preset);
    remaining = +btn.dataset.preset;
    state = 'idle';
    syncButtons();
    render();
  });
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); startBtn.click(); }
  if (e.key.toLowerCase() === 'r') reset();
});

volumeSlider.addEventListener('input', () => {
  const v = volumeSlider.value / 100;
  if (master) master.gain.value = v * 0.8;
  if (userTrack) userTrack.volume = v;
  if (ytReady && ytPlayer) ytPlayer.setVolume(+volumeSlider.value);
});

function setSource(next) {
  if (next === source) return;
  musicStop();
  source = next;
  document.querySelectorAll('[data-source]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.source === next)));
  ytWrap.classList.toggle('hidden', next !== 'youtube');
  fileWrap.classList.toggle('hidden', next !== 'file');
  ytStatus('');
  if (next === 'youtube') ensurePlayer().then(primePlayer).catch(() => {});
  if (state === 'running') musicStart();
  track('music_source', { source: next });
}

document.querySelectorAll('[data-source]').forEach(btn =>
  btn.addEventListener('click', () => setSource(btn.dataset.source)));

ytUrl.addEventListener('change', () => {
  const id = parseVideoId(ytUrl.value);
  if (!id) { ytStatus(ytUrl.value.trim() ? 'That doesn’t look like a YouTube link.' : ''); return; }
  videoId = id;
  videoStart = parseStartTime(ytUrl.value);
  ytUrl.value = '';
  ytStatus('');
  if (ytReady && ytPlayer) {
    if (state === 'running') ytPlayer.loadVideoById({ videoId: id, startSeconds: videoStart });
    else { ytPlayer.cueVideoById({ videoId: id, startSeconds: videoStart }); ytPrimed = false; }
  }
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (userTrack) { userTrack.pause(); URL.revokeObjectURL(userTrack.src); userTrack = null; }
  if (!file) return;
  userTrack = new Audio(URL.createObjectURL(file));
  userTrack.loop = true;
  userTrack.volume = volumeSlider.value / 100;
  if (state === 'running') { musicStop(); musicStart(); }
});

// Never let audio outlive a hidden tab while paused mid-song.
window.addEventListener('pagehide', musicStop);

/* ------------------------------------------------------------------ *
 * Sharing. The link carries the current duration as ?t=, so whoever
 * opens it lands on the same timer rather than the default one.
 * ------------------------------------------------------------------ */
const shareBtn = document.getElementById('share');
const shareLabel = document.getElementById('share-label');
const SHARE_LABEL = shareLabel.textContent;
let shareRevert = null;

/* Seconds -> the shorthand parseDuration already understands ("25m"). */
function compactDuration(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor(secs / 60) % 60, s = secs % 60;
  return `${h ? h + 'h' : ''}${m ? m + 'm' : ''}${s ? s + 's' : ''}` || '0s';
}

function shareUrl() {
  const url = new URL(location.href);
  url.search = '';
  url.hash = '';
  const secs = parseDuration(input.value);
  if (secs > 0) url.searchParams.set('t', compactDuration(secs));
  return url.toString();
}

function shareFeedback(msg) {
  shareLabel.textContent = msg;
  clearTimeout(shareRevert);
  shareRevert = setTimeout(() => { shareLabel.textContent = SHARE_LABEL; }, 2200);
}

function recordShare(method) {
  track('share', { method, content_type: 'timer', duration_seconds: parseDuration(input.value) || 0 });
  postTally('/api/shares')
    .then(({ shares }) => showTotal(sharesLabel, shares, sharesText))
    .catch(() => {});
}

function promptLink(url) {
  window.prompt('Copy this link:', url);
  recordShare('prompt');
}

function copyLink(url) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => { shareFeedback('Link copied'); recordShare('clipboard'); })
      .catch(() => promptLink(url));
  } else {
    promptLink(url);
  }
}

shareBtn.addEventListener('click', async () => {
  const url = shareUrl();
  const secs = parseDuration(input.value) || 0;
  const text = secs > 0
    ? `A ${format(secs)} countdown timer that plays The Final Countdown.`
    : 'A countdown timer that plays The Final Countdown.';

  // The native sheet is the good path on mobile; desktop mostly lacks it.
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Final Countdown Timer', text, url });
      recordShare('native');
      return;
    } catch (err) {
      // Dismissing the sheet is a normal outcome, not a failure to fall back on.
      if (err && err.name === 'AbortError') {
        track('share_dismissed');
        return;
      }
    }
  }
  copyLink(url);
});

// Honour ?t= from a shared link before the first render.
const sharedTime = parseDuration(new URLSearchParams(location.search).get('t') || '');
if (sharedTime > 0) {
  input.value = format(sharedTime);
  track('shared_link_open', { duration_seconds: sharedTime });
}

/* ------------------------------------------------------------------ *
 * Public tallies: visits under the title, shares under the Share
 * button. A line stays blank unless the server returns a real total,
 * so a failed request never shows a wrong number.
 * ------------------------------------------------------------------ */
const visitsLabel = document.getElementById('visits');
const sharesLabel = document.getElementById('shares');
const countFormat = new Intl.NumberFormat('en-US');

const ordinalRule = new Intl.PluralRules('en-US', { type: 'ordinal' });
const ORDINAL_SUFFIX = { one: 'st', two: 'nd', few: 'rd', other: 'th' };

function showVisits(total) {
  if (!Number.isSafeInteger(total) || total < 1) return;
  const rank = document.createElement('span');
  rank.className = 'visit-rank';
  rank.textContent = `${countFormat.format(total)}${ORDINAL_SUFFIX[ordinalRule.select(total)]}`;
  visitsLabel.replaceChildren('You’re the ', rank, ' rocker');
}

function sharesText(n) {
  if (n === 0) return 'Be the first';
  if (n === 1) return 'Shared once';
  if (n === 2) return 'Shared twice';
  return `Shared ${countFormat.format(n)} times`;
}

function showTotal(label, total, text) {
  if (Number.isSafeInteger(total) && total >= 0) label.textContent = text(total);
}

function postTally(path) {
  return fetch(path, { method: 'POST' })
    .then(res => res.ok ? res.json() : Promise.reject(new Error(`HTTP ${res.status}`)));
}

postTally('/api/visits')
  .then(({ visits, shares }) => {
    showVisits(visits);
    showTotal(sharesLabel, shares, sharesText);
  })
  .catch(() => {});

remaining = parseDuration(input.value) || 0;
syncButtons();
render();

// YouTube is the default source, so build the player up front. Start then has
// a ready player to talk to and inherits the click's transient activation.
if (source === 'youtube') ensurePlayer().catch(() => ytStatus('Couldn’t load the YouTube player.'));
</script>
</body>
</html>
